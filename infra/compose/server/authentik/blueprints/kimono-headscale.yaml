# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Kimono Headscale
  labels:
    blueprints.goauthentik.io/description: Kimono mesh OIDC provider and application
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true

  - id: kimono-authentication-flow
    model: authentik_flows.flow
    state: present
    identifiers:
      slug: kimono-authentication-flow
    attrs:
      name: Kimono authentication
      title: おかえりなさい · Welcome home
      designation: authentication
      authentication: none
      layout: content_left
      background: /static/kimono/sakura-branch-v2.png

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-authentication-flow
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
      order: 10

  - id: kimono-authentication-password-binding
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-authentication-flow
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20
    attrs:
      re_evaluate_policies: true

  - id: kimono-authentication-mfa-binding
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-authentication-flow
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-authentication-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kimono-authentication-password-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-password-stage]]
      order: 10
    attrs:
      failure_result: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kimono-authentication-mfa-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-authenticator-validate-stage]]
      order: 10
    attrs:
      failure_result: true

  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: !Env AUTHENTIK_DOMAIN
    attrs:
      default: false
      branding_title: Kimono
      branding_logo: /static/kimono/kimono-sakura-mark.svg
      branding_favicon: /static/kimono/kimono-sakura-mark.svg
      branding_default_flow_background: /static/kimono/sakura-branch-v2.png
      branding_custom_css: !File /blueprints/kimono/kimono.css
      flow_authentication: !KeyOf kimono-authentication-flow
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_recovery: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      flow_unenrollment: !Find [authentik_flows.flow, [slug, default-unenrollment-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      attributes:
        settings:
          locale: en
          theme:
            base: light

  - id: kimono-headscale-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Kimono Headscale
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env KIMONO_HEADSCALE_OIDC_CLIENT_ID
      client_secret: !Env KIMONO_HEADSCALE_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: !Env KIMONO_HEADSCALE_OIDC_REDIRECT_URI
          matching_mode: strict
          redirect_uri_type: authorization

  - model: authentik_core.application
    state: present
    identifiers:
      slug: kimono-headscale
    attrs:
      name: Kimono Mesh
      provider: !KeyOf kimono-headscale-provider
      meta_description: Private access to your Kimono devices.
      open_in_new_tab: true

  - id: kimono-portal-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Kimono Portal
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env KIMONO_PORTAL_OIDC_CLIENT_ID
      client_secret: !Env KIMONO_PORTAL_OIDC_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: !Env KIMONO_PORTAL_OIDC_REDIRECT_URI
          matching_mode: strict
          redirect_uri_type: authorization

  - model: authentik_core.application
    state: present
    identifiers:
      slug: kimono-portal
    attrs:
      name: Kimono
      provider: !KeyOf kimono-portal-provider
      meta_description: Your household, thoughtfully connected.
      meta_launch_url: !Env KIMONO_PORTAL_URL
      open_in_new_tab: true
