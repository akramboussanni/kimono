# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Kimono Portal
  labels:
    blueprints.goauthentik.io/description: Kimono Portal OIDC provider and application
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true

  - id: kimono-local-authentication-flow
    model: authentik_flows.flow
    state: present
    identifiers:
      slug: kimono-local-authentication-flow
    attrs:
      name: Kimono local authentication
      title: おかえりなさい · Welcome home
      designation: authentication
      authentication: none
      layout: content_left
      background: http://localhost:3000/art/sakura-branch-v2.png

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-local-authentication-flow
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
      order: 10

  - id: kimono-local-password-binding
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-local-authentication-flow
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20
    attrs:
      re_evaluate_policies: true

  - id: kimono-local-mfa-binding
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-local-authentication-flow
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf kimono-local-authentication-flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kimono-local-password-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-password-stage]]
      order: 10
    attrs:
      failure_result: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf kimono-local-mfa-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-authenticator-validate-stage]]
      order: 10
    attrs:
      failure_result: true

  - id: kimono-local-brand
    model: authentik_brands.brand
    state: present
    identifiers:
      domain: localhost
    attrs:
      default: true
      branding_title: Kimono
      branding_logo: http://localhost:3000/kimono-sakura-mark.svg
      branding_favicon: http://localhost:3000/kimono-sakura-mark.svg
      branding_default_flow_background: http://localhost:3000/art/sakura-branch-v2.png
      branding_custom_css: !File /blueprints/kimono/kimono.css
      flow_authentication: !KeyOf kimono-local-authentication-flow
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_recovery: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      flow_unenrollment: !Find [authentik_flows.flow, [slug, default-unenrollment-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      attributes:
        settings:
          locale: en
          theme:
            base: light

  - id: kimono-portal-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Kimono Portal
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env KIMONO_PORTAL_OIDC_CLIENT_ID
      client_secret: !Env KIMONO_PORTAL_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      # Auth.js discovers metadata from this provider-specific URL and requires
      # the returned issuer to match it exactly.
      issuer_mode: per_provider
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: http://localhost:3000/api/auth/callback/authentik
          matching_mode: strict
          redirect_uri_type: authorization

  - model: authentik_core.application
    state: present
    identifiers:
      slug: kimono-portal
    attrs:
      name: Kimono Portal
      provider: !KeyOf kimono-portal-provider
      meta_description: Your household, thoughtfully connected.
      meta_launch_url: http://localhost:3000
      open_in_new_tab: true
