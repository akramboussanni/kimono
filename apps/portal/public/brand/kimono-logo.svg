<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 112" role="img" aria-labelledby="title desc">
  <title id="title">Kimono</title>
  <desc id="desc">Kimono wordmark with a flowering sakura branch</desc>
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8f6"/>
      <stop offset=".58" stop-color="#f2cbd2"/>
      <stop offset="1" stop-color="#d77b8c"/>
    </linearGradient>
    <radialGradient id="heart">
      <stop stop-color="#a84d63"/>
      <stop offset="1" stop-color="#6f3446"/>
    </radialGradient>
    <path id="large-petal" d="M0-4C-13-15-14-33-2-43 4-48 8-47 11-41 6-39 4-36 5-33 8-36 12-36 16-31 25-20 16-7 0-4Z"/>
    <path id="small-petal" d="M0-3C-9-11-10-23-2-30 2-34 6-33 8-29 4-27 3-25 4-23 6-25 9-25 11-22 17-14 11-5 0-3Z"/>
  </defs>

  <g fill="none" stroke="#5f3441" stroke-linecap="round">
    <path d="M7 95C31 85 46 69 61 51 73 36 89 28 117 24" stroke-width="5.5"/>
    <path d="M42 75C58 73 71 76 84 86M76 36C88 41 97 49 102 61M105 27C116 18 127 13 141 13" stroke-width="2.5"/>
    <path d="M18 91C37 84 49 72 61 56" stroke="#a84d63" stroke-width="1.2" opacity=".8"/>
  </g>

  <g transform="translate(69 44)">
    <g fill="url(#petal)" stroke="#bd6679" stroke-width="1.2" stroke-linejoin="round">
      <use href="#large-petal"/>
      <use href="#large-petal" transform="rotate(72)"/>
      <use href="#large-petal" transform="rotate(144)"/>
      <use href="#large-petal" transform="rotate(216)"/>
      <use href="#large-petal" transform="rotate(288)"/>
    </g>
    <g fill="none" stroke="#a84d63" stroke-width=".8" stroke-linecap="round" opacity=".7">
      <path d="M0-4 1-29"/><path d="M0-4 1-29" transform="rotate(72)"/>
      <path d="M0-4 1-29" transform="rotate(144)"/><path d="M0-4 1-29" transform="rotate(216)"/>
      <path d="M0-4 1-29" transform="rotate(288)"/>
    </g>
    <circle r="7.5" fill="url(#heart)"/>
    <g fill="#f5d9c0">
      <circle cx="0" cy="-5" r="1.3"/><circle cx="4.8" cy="-1.5" r="1.3"/>
      <circle cx="3" cy="4" r="1.3"/><circle cx="-3" cy="4" r="1.3"/>
      <circle cx="-4.8" cy="-1.5" r="1.3"/>
    </g>
  </g>

  <g transform="translate(113 26) scale(.58)">
    <g fill="url(#petal)" stroke="#bd6679" stroke-width="1.4" stroke-linejoin="round">
