      <use href="#small-petal" transform="rotate(144)"/><use href="#small-petal" transform="rotate(216)"/>
      <use href="#small-petal" transform="rotate(288)"/>
    </g>
    <circle r="5" fill="#7a3f50"/>
  </g>

  <g fill="#d77b8c" stroke="#a84d63" stroke-width=".8">
    <ellipse cx="87" cy="83" rx="5" ry="9" transform="rotate(-36 87 83)"/>
    <ellipse cx="139" cy="14" rx="4" ry="7" transform="rotate(56 139 14)"/>
  </g>

  <path d="M153 24v64" stroke="#d9b4ba" stroke-width="1"/>
  <text x="177" y="65" fill="#34262a" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="5">KIMONO</text>
  <g fill="#a84d63">
    <rect x="178" y="80" width="31" height="1.5" rx=".75"/>
    <text x="219" y="85" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2.6">HOUSEHOLD SYSTEM</text>
  </g>
